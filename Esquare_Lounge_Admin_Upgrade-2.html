<script>
const firebaseConfig={apiKey:"AIzaSyAFejYmJsLZ70AU0yCnEkEr_FTxAY1H3LE",authDomain:"nepali-online-food.firebaseapp.com",projectId:"nepali-online-food",storageBucket:"nepali-online-food.firebasestorage.app",messagingSenderId:"949435549942",appId:"1:949435549942:web:4bcbcaa1147cd4ea6504d7",measurementId:"G-QZE8Z06Y9Z"};
let FB=null,FIREBASE_ONLINE=false;
try{if(window.firebase){FB=firebase.initializeApp(firebaseConfig);FIREBASE_ONLINE=true;}}catch(e){console.warn("Firebase init failed",e)}
const FS=()=>FIREBASE_ONLINE?firebase.firestore():null;

const OWNER_UID='ZtLRI7IJzOd4vCzoQXzSAdpNSDI3';
let RESTAURANTS=[{id:DEFAULT_RESTAURANT_ID,name:'Esquare Lounge',description:'Dine-in and online ordering',address:'',phone:'',deliveryAvailable:true,pickupAvailable:true,active:true,ownerEmail:''}];

<script>
/* ============ Esquare Lounge — built by Niraj Xettri ============
   Local storage layer for app preferences and cached data. */
const DB={
  get(k,d){try{const v=localStorage.getItem('nof_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('nof_'+k,JSON.stringify(v));}catch(e){toast('Local storage unavailable.')} return true}
};
// Device-only photo vault: keeps large gallery images out of localStorage (which has a small quota).
let photoDBPromise=null;
function openPhotoDB(){
  if(!('indexedDB' in window))return Promise.reject(new Error('This browser does not support local photo storage.'));
  if(photoDBPromise)return photoDBPromise;
  photoDBPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open('EsquareLoungeLocalPhotos',1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos');};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('Could not open local photo storage.'));
  });
  return photoDBPromise;
}
async function putLocalFoodPhoto(id,data){const db=await openPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(data,String(id));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Could not save photo on this device.'));});}
async function getLocalFoodPhoto(id){const db=await openPhotoDB();return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly'),r=tx.objectStore('photos').get(String(id));r.onsuccess=()=>resolve(r.result||'');r.onerror=()=>reject(r.error||new Error('Could not read saved photo.'));});}
async function deleteLocalFoodPhoto(id){try{const db=await openPhotoDB();await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(String(id));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}catch(e){console.warn('Local photo cleanup failed',e);}}
async function hydrateLocalFoodPhotos(){
  if(!Array.isArray(S.foods))return;
  let changed=false;
  for(const f of S.foods){try{const saved=await getLocalFoodPhoto(f.id);if(saved){f.img=saved;changed=true;}}catch(e){console.warn('Could not restore local photo',f.id,e);}}
  if(changed&&S.view!=='checkout')render();
}
function persistFoodsWithoutPhotos(){
  const safe=S.foods.map(f=>({...f,img:String(f.img||'').startsWith('data:image/')?'':f.img||''}));
  try{localStorage.setItem('nof_foods',JSON.stringify(safe));return true;}
  catch(e){console.error('Menu local save failed',e);toast('Menu could not be saved. Free some device storage and try again.');return false;}
}

async function ensureCustomerAuth(){
  if(!FIREBASE_ONLINE||!AUTH()) return null;
  if(AUTH().currentUser) return AUTH().currentUser;
  try{const r=await AUTH().signInAnonymously();return r.user}catch(e){console.warn('Anonymous auth failed',e);const code=e&&e.code?e.code:'unknown';toast(code==='auth/operation-not-allowed'?'Enable Anonymous sign-in in Please contact support to enable customer sign-in.':'Customer sign-in failed ('+code+'). Please check your internet connection or contact support.');return null}
}
function isSuperAdmin(){return !!(AUTH()&&AUTH().currentUser&&AUTH().currentUser.uid===OWNER_UID)}
function isManager(){return !!(S&&S.staffRole==='manager'&&!isSuperAdmin())}
function isOwner(){return isSuperAdmin()||!!(S&&S.ownerRestaurantId&&AUTH()&&AUTH().currentUser&&S.ownerUid===AUTH().currentUser.uid)}

async function loadCloudCatalog(){
  if(!FIREBASE_ONLINE)return;
  try{
    const suffix=RESTAURANT_ID===DEFAULT_RESTAURANT_ID?'':'__'+RESTAURANT_ID;
    const [c,f]=await Promise.all([FS().collection('appState').doc('cats'+suffix).get(),FS().collection('appState').doc('foods'+suffix).get()]);
    if(c.exists&&c.data().value&&JSON.stringify(c.data().value)===JSON.stringify(SEED_CATS))S.cats=c.data().value;
    if(f.exists&&f.data().value){const remote=f.data().value;const current=Array.isArray(remote)&&remote.length===SEED_FOODS.length&&remote.every((x,i)=>x.id==='f'+(i+1)&&x.name===SEED_FOODS[i][0]&&x.cat===SEED_FOODS[i][1]&&Number(x.price)===Number(SEED_FOODS[i][2]));if(current){const localPhotos=new Map((S.foods||[]).map(x=>[x.id,x.img]));S.foods=remote.map(x=>({...x,img:(localPhotos.get(x.id)&&String(localPhotos.get(x.id)).startsWith('data:image/'))?localPhotos.get(x.id):(x.img||'')}));}}
    DB.set('cats',S.cats);DB.set('foods',S.foods);
  }catch(e){console.warn('Catalog load failed',e)}
}

async function loadRestaurants(){
  if(!FIREBASE_ONLINE||!FS())return;
  try{
    const snap=await FS().collection('restaurants').get();
    const cloud=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.active!==false);
    if(!cloud.some(r=>r.id===DEFAULT_RESTAURANT_ID)) cloud.unshift(RESTAURANTS[0]);
    if(cloud.length)RESTAURANTS=cloud;
    if(!RESTAURANTS.some(r=>r.id===RESTAURANT_ID))RESTAURANT_ID=RESTAURANTS[0].id;
    localStorage.setItem('nof_selected_restaurant',RESTAURANT_ID);
    render();
  }catch(e){console.warn('Restaurant list unavailable; using local default',e)}
}
function chooseRestaurant(id){
  const r=RESTAURANTS.find(x=>x.id===id);if(!r)return;
  if(Object.keys(S.cart||{}).length&&id!==RESTAURANT_ID&&!confirm('Changing restaurant will clear your current cart. Continue?'))return;
  if(id!==RESTAURANT_ID){S.cart={};DB.set('cart',S.cart);RESTAURANT_ID=id;localStorage.setItem('nof_selected_restaurant',id);S.cat='All';
    seed();render();loadCloudCatalog().then(()=>{syncCatalog();render()});
  }else render();
}

function syncCatalog(){
  if(!FIREBASE_ONLINE)return;
  catalogListeners.forEach(unsub=>{try{unsub()}catch(e){}});catalogListeners=[];
  ['cats','foods'].forEach(k=>{
    const suffix=RESTAURANT_ID===DEFAULT_RESTAURANT_ID?'':'__'+RESTAURANT_ID;
    const unsub=FS().collection('appState').doc(k+suffix).onSnapshot(s=>{
      if(!s.exists)return; const v=s.data().value;if(v===undefined)return;
      if(k==='cats'&&JSON.stringify(v)!==JSON.stringify(SEED_CATS))return;
      if(k==='foods'&&!(Array.isArray(v)&&v.length===SEED_FOODS.length&&v.every((x,i)=>x.id==='f'+(i+1)&&x.name===SEED_FOODS[i][0]&&x.cat===SEED_FOODS[i][1]&&Number(x.price)===Number(SEED_FOODS[i][2]))))return;
      if(k==='foods'){const localPhotos=new Map((S.foods||[]).map(x=>[x.id,x.img]));v=v.map(x=>({...x,img:(localPhotos.get(x.id)&&String(localPhotos.get(x.id)).startsWith('data:image/'))?localPhotos.get(x.id):(x.img||'')}));}
      DB.set(k,v);if(typeof S!=='undefined'&&S.foods){S[k]=v;if(!$('#layer').innerHTML&&!['checkout'].includes(S.view))render();}
    },e=>console.warn('Catalog listener failed',k,e));catalogListeners.push(unsub);
  });
}

function inferFoodType(f){

  if(/buff|chicken|mutton|pork|beef|meat|tuna|fish|seafood|egg|mixed momo|mixed spaghetti|snicker|lek mars/.test(t))return 'nonveg';

async function ensureCustomerAuth(){
  if(!FIREBASE_ONLINE||!AUTH())return null;
  const current=AUTH().currentUser;
  // A signed-in owner is still a valid Firebase user for creating an order.
  // The previous check returned null for the owner account and blocked checkout.
  if(current)return current;
  try{const r=await AUTH().signInAnonymously();return r.user;}
  catch(e){console.error('Guest customer sign-in failed',e);const code=e&&e.code?e.code:'unknown';if(code==='auth/operation-not-allowed')throw new Error('Customer session could not be started. Please try again or contact support.');if(code==='auth/unauthorized-domain')throw new Error('This website domain is not authorized for sign-in. Please contact the website administrator.');if(code==='auth/network-request-failed')throw new Error('Sign-in failed due to a network issue. Check your internet and try again.');if(code==='auth/invalid-api-key')throw new Error('Sign-in service configuration needs attention. Please contact support.');throw new Error('Customer sign-in failed ('+code+'): '+(e&&e.message?e.message:'check Firebase settings and internet.'));}
}

function playKitchenChime(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const ctx=new C(),now=ctx.currentTime;
    [880,1175,1568].forEach((hz,i)=>{
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.type='sine';osc.frequency.value=hz;
      gain.gain.setValueAtTime(.0001,now+i*.13);
      gain.gain.exponentialRampToValueAtTime(.16,now+i*.13+.025);
      gain.gain.exponentialRampToValueAtTime(.0001,now+i*.13+.22);
      osc.connect(gain);gain.connect(ctx.destination);osc.start(now+i*.13);osc.stop(now+i*.13+.24);
    });
    setTimeout(()=>ctx.close(),1000);
  }catch(e){console.warn('Kitchen chime unavailable',e);}
}
function speakKitchenOrder(o){
  try{
    if(!('speechSynthesis' in window))return;
    const table=o.tableNo||o.customer?.tableNo||'टेबल उल्लेख छैन';
    const items=(o.items||[]).slice(0,6).map(i=>(i.qty||1)+' '+(i.name||'खाना')).join(', ');
    const msg=new SpeechSynthesisUtterance('नयाँ अर्डर आएको छ। '+(o.fulfillmentMode==='pickup'?'पिकअप अर्डर।':'टेबल नम्बर '+table+'।')+' अर्डर: '+items+'। कृपया अर्डर तयार गर्नुहोस्।');
    msg.lang='ne-NP';msg.rate=.88;msg.pitch=1.18;msg.volume=1;
    const chooseVoice=()=>{
      const voices=window.speechSynthesis.getVoices()||[];
      const nepali=voices.filter(v=>/^ne([-_]|$)/i.test(v.lang)||/nepali/i.test(v.name));
      const hindi=voices.filter(v=>/^hi([-_]|$)/i.test(v.lang));
      const femaleHint=v=>/female|woman|kalpana|heera|lekha/i.test(v.name);
      const voice=nepali.find(femaleHint)||nepali[0]||hindi.find(femaleHint)||hindi[0];
      if(voice){msg.voice=voice;if(!/^ne([-_]|$)/i.test(voice.lang))msg.lang=voice.lang;}
      window.speechSynthesis.cancel();window.speechSynthesis.speak(msg);
    };
    if(window.speechSynthesis.getVoices().length)chooseVoice();
    else {window.speechSynthesis.onvoiceschanged=chooseVoice;setTimeout(()=>{if(!msg.voice)chooseVoice()},900);}
  }catch(e){console.warn('Kitchen voice alert unavailable',e);}
}

function notifyNewOrder(o){
  const customer=(o&&o.customer&&o.customer.name)||'Customer';
  const message='New order from '+customer+' · '+(o&&o.id?o.id:'');
  toast(message);
  const prefs=kitchenPrefs();
  if(prefs.sound)playKitchenChime();
  if(prefs.voice)speakKitchenOrder(o);
  if(prefs.autoConfirm && o && o.status==='Pending'){
    saveOrderStatus(o.id,'Confirmed').then(()=>{
      const local=(S.orders||[]).find(x=>x.id===o.id);if(local)local.status='Confirmed';
      DB.set('orders',S.orders||[]);
      if(S.view==='admin')render();
    }).catch(e=>console.warn('Auto-confirm failed; order remains pending',e));
  }
  try{
    if('Notification' in window && Notification.permission==='granted'){
      const n=new Notification('Esquare Lounge — New Order',{body:message,tag:'order-'+(o&&o.id||Date.now()),icon:'./favicon.ico'});
      n.onclick=()=>{window.focus();S.view='admin';render();n.close();};
    }
  }catch(e){console.warn('Desktop notification unavailable',e);}
}
function requestOrderNotificationPermission(){
  try{
    if('Notification' in window && Notification.permission==='default'){
      Notification.requestPermission().catch(e=>console.warn('Notification permission not granted',e));
    }
  }catch(e){console.warn('Notification permission unavailable',e);}
}
function watchAdminOrders(){
  if(!FIREBASE_ONLINE||!isOwner())return;
  requestOrderNotificationPermission();
  try{if(adminOrdersUnsub)adminOrdersUnsub();}catch(e){}
  adminOrderFirstSnapshot=true;adminKnownOrderIds=new Set();
  const q=isSuperAdmin()?FS().collection('orders'):FS().collection('orders').where('restaurantId','==',S.ownerRestaurantId||RESTAURANT_ID);
  q.get().then(s=>{
    S.orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created||0)-(a.created||0));
    adminKnownOrderIds=new Set(S.orders.map(o=>o.id));
    DB.set('orders',S.orders);
    if(S.view==='admin')render();
  }).catch(e=>{
    console.error('Admin initial order load failed',e);
    if(S.view==='admin')toast('Cannot read orders: '+(e.code||e.message||'permission denied'));
  });
  adminOrdersUnsub=q.onSnapshot(s=>{
    const incoming=s.docs.map(d=>({id:d.id,...d.data()}));
    if(adminOrderFirstSnapshot){
      adminOrderFirstSnapshot=false;
      incoming.forEach(o=>adminKnownOrderIds.add(o.id));
    }else{
      s.docChanges().forEach(change=>{
        if(change.type==='added'){
          const o={id:change.doc.id,...change.doc.data()};
          if(!adminKnownOrderIds.has(o.id)){adminKnownOrderIds.add(o.id);notifyNewOrder(o);}
        }
      });
    }
    S.orders=incoming.sort((a,b)=>(b.created||0)-(a.created||0));
    DB.set('orders',S.orders);
    if(S.view==='admin'&&!$('#layer').innerHTML)render();
  },e=>{
    console.error('Admin order listener failed',e);
    if(S.view==='admin')toast('Live orders error: '+(e.code||e.message||'permission denied'));
  });
}
function watchCustomerOrders(){
  if(!FIREBASE_ONLINE||!AUTH())return;
  const u=AUTH().currentUser;if(!u)return;
  FS().collection('orders').where('customerUid','==',u.uid).where('restaurantId','==',RESTAURANT_ID).onSnapshot(s=>{
    const cloud=s.docs.map(d=>d.data()).sort((a,b)=>(b.created||0)-(a.created||0));
    // Replace the shared device cache, including when this user has no orders.
    S.orders=cloud;
    S.my=cloud.map(o=>o.id);
    try{localStorage.setItem('nof_orders',JSON.stringify(cloud));localStorage.setItem('nof_my',JSON.stringify(S.my));}catch(e){}
    if(['orders','done'].includes(S.view)&&!$('#layer').innerHTML)render();
  },e=>console.warn('Customer order listener failed',e));
}
async function saveOrderStatus(id,status){
  if(!isOwner())throw new Error('Owner login required');
  const ref=FS().collection('orders').doc(id);
  const snap=await ref.get();if(!snap.exists)throw new Error('Order not found');
  const o=snap.data();if(!isSuperAdmin()&&o.restaurantId!==(S.ownerRestaurantId||RESTAURANT_ID))throw new Error('You can only update orders for your own restaurant.');const log=o.log||[];log.push({s:status,t:Date.now()});
  await ref.update({status,log});
}

  const item={name:($('#fbName')?.value||'').trim().slice(0,80),rating:Number($('#fbRating')?.value||5),type:$('#fbType')?.value||'General feedback',message:message.slice(0,1200),createdAt:Date.now(),restaurantId:RESTAURANT_ID,...(currentUser&&!currentUser.isAnonymous?{userId:currentUser.uid}: {})};
  try{
    if(FIREBASE_ONLINE&&FS()){
      await FS().collection('feedback').add(item);
      closeSheet();toast('Thank you! Your feedback was submitted.');
    }else{
      const saved=DB.get('feedback',[]);saved.unshift(item);DB.set('feedback',saved);
      closeSheet();toast('Feedback saved on this device only. Contact support to send it to us.');
    }
  }catch(e){
    console.error('Feedback submit failed',e);
    if(err)err.textContent='Online feedback failed ('+(e.code||e.message||'unknown error')+'). Please try again or call '+SUPPORT_PHONE+'.';
  }
}

function customerTipCalc(){
  const total=Object.entries(S.cart||{}).reduce((sum,[id,q])=>sum+(Number(food(id)?.price)||0)*Number(q||0),0);
  const base=total||Number(prompt('Enter bill amount in Rs.'));
  if(!Number.isFinite(base)||base<=0)return toast('Enter a valid bill amount.');
  const pct=Number(prompt('Optional tip percentage (0–30):','5'));
  if(!Number.isFinite(pct)||pct<0||pct>30)return toast('Enter a tip from 0% to 30%.');
  alert('Bill: Rs. '+base.toFixed(2)+'\\nTip ('+pct+'%): Rs. '+(base*pct/100).toFixed(2)+'\\nTotal: Rs. '+(base*(1+pct/100)).toFixed(2));
}

function customerBudgetCombo(){
  const raw=prompt('Your total food budget in Rs.');if(raw===null)return;const budget=Number(raw);if(!Number.isFinite(budget)||budget<=0)return toast('Enter a valid budget.');
  const items=S.foods.filter(f=>f.avail&&Number(f.price)>0).sort((a,b)=>Number(a.price)-Number(b.price));let total=0,pick=[];
  for(const f of items){if(total+Number(f.price)<=budget){pick.push(f);total+=Number(f.price);}if(pick.length===3)break;}
  if(!pick.length)return toast('No available dish fits this budget.');
  const choice=confirm('BUDGET COMBO\\n'+pick.map(f=>'• '+f.name+' — Rs. '+f.price).join('\\n')+'\\nTotal: Rs. '+total+'\\n\\nAdd these items to your cart?');
  if(choice){pick.forEach(f=>{S.cart[f.id]=Math.min(20,(S.cart[f.id]||0)+1)});save('cart');renderNav();toast('Budget combo added to cart.');}
}

async function getDeliveryLocation(){
  const msg=$('#locmsg');
  const showManualHelp=(reason)=>{
    if(msg)msg.innerHTML=esc(reason)+`<br><br>Check that phone Location/GPS is on and allow location permission for this app/browser. GPS requires this website to be opened over HTTPS and the customer must allow location permission. If location is denied, the customer can enter an address or Maps link manually. <button type="button" class="btn blue" style="margin-top:8px" onclick="showMapPreviewFromButton()">🗺️ Show address on map</button><div id="mapPreview"></div><div style="margin-top:6px">You can also enter the delivery address manually.</div>`;
  };
  if(!navigator.geolocation){showManualHelp('Location is not available in this browser. Open the published website over HTTPS and allow location permission, or enter the delivery address manually.');return toast('Location is not supported here');}
  if(!window.isSecureContext && location.protocol!=='file:'){
    showManualHelp('Location access requires HTTPS. Publish this page on an HTTPS website and allow location permission, or enter the delivery address manually.');
    return;
  }
  if(msg)msg.textContent='Requesting location permission…';
  try{
    navigator.geolocation.getCurrentPosition(pos=>{
      S.deliveryLocation={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,capturedAt:Date.now()};
      DB.set('deliveryLocation',S.deliveryLocation);
      const lat=S.deliveryLocation.lat,lng=S.deliveryLocation.lng;
      if(msg)msg.innerHTML='✅ Location captured. <a class="btn blue" style="display:inline-block;margin-top:8px" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+lat+','+lng+'">🗺️ Preview my location</a><div class="mut">Coordinates will be attached to your order.</div>';
      const a=$('#cmap');if(a&&!a.value.trim())a.value='https://www.google.com/maps/search/?api=1&query='+lat+','+lng;
      toast('Delivery location added');
    },err=>{
      console.warn('Geolocation error',err);
      const reasons={1:'Location permission was denied. Allow location permission in your browser settings and try again, or enter the delivery address manually.',2:'Phone could not determine the location. Check GPS and internet.',3:'Location request timed out. Try again outdoors.'};
      showManualHelp(reasons[err&&err.code]||'Could not get your location.');
      toast('Location unavailable — check permission and GPS');
    },{enableHighAccuracy:true,timeout:25000,maximumAge:0});
  }catch(err){console.warn('Geolocation request failed',err);showManualHelp('The app could not start a location request.');}
}

function deliveryOrderCard(o){const loc=o.customer&&o.customer.location;const url=(loc&&loc.lat!=null&&loc.lng!=null)?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(loc.lat+','+loc.lng):(o.customer&&o.customer.mapsUrl)||'';return `<div class="card"><div class="row sp"><b>${esc(o.id)}</b><span class="badge-s st${STAT.indexOf(o.status)}">${esc(o.status)}</span></div><div class="mut">${fdate(o.created)} · ${esc(o.restaurantName||'Restaurant')}</div><h3>👤 ${esc(o.customer&&o.customer.name||'Customer')}</h3>${o.customer&&o.customer.district?`<p>🗺️ District: <b>${esc(o.customer.district)}</b></p>`:''}<p>📞 <a href="tel:${esc(o.customer&&o.customer.phone||'')}">${esc(o.customer&&o.customer.phone||'No phone')}</a></p><p>${(o.items||[]).map(i=>`${i.qty||i.quantity||1} × ${esc(i.name)}`).join('<br>')}</p><div class="row sp"><b>Total</b><b class="price">${rs(o.total)}</b></div><p class="mut">📍 Delivery address: ${esc(o.customer&&o.customer.address||'Address not provided')}</p><button class="btn gray sm" onclick="deliveryCopyAddress('${esc(o.id)}')">📋 Copy address</button>${url?`<a class="btn blue" style="display:block;text-align:center;margin-top:10px" target="_blank" rel="noopener" href="${esc(url)}">🗺️ Navigate to customer</a>`:'<div class="mut">No customer map location was saved.</div>'}<div class="mut" style="margin-top:12px"><b>Update delivery status</b><br>Tap the correct step so the customer and restaurant can follow the order.</div><div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">${['Confirmed','Delivered'].map(st=>`<button class="btn ${o.status===st?'':'gray'} sm" ${o.status===st?'disabled':''} onclick="deliverySetStatus('${esc(o.id)}','${st}')">${st==='Confirmed'?'✅ Confirmed':'📦 Delivered'}</button>`).join('')}</div></div>`}

async function deliveryCopyAddress(id){const o=deliveryAssignedList.find(x=>x.id===id);const address=String(o&&o.customer&&o.customer.address||'').trim();if(!address)return toast('Customer address is not available.');try{await navigator.clipboard.writeText(address);toast('Customer address copied.')}catch(e){const t=document.createElement('textarea');t.value=address;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Customer address copied.')}catch(_){toast(address)}t.remove();}}

async function deliveryLogin(){const email=($('#deliveryEmail')?.value||'').trim().toLowerCase(),password=$('#deliveryPassword')?.value||'',err=$('#deliveryErr');if(err)err.textContent='';if(!email||!password){if(err)err.textContent='Enter your email and password.';return;}if(!FIREBASE_ONLINE||!AUTH()||!FS()){if(err)err.textContent='Online service is temporarily unavailable. Check connection.';return;}try{await AUTH().signInWithEmailAndPassword(email,password);deliveryAssignedList=[];await deliveryLoadAssigned();render();}catch(e){if(err)err.textContent='Login failed: '+(e.code||e.message||'unknown error');}}
async function deliveryLoadAssigned(){const u=AUTH()&&AUTH().currentUser,err=$('#deliveryErr');if(err)err.textContent='';if(!u||u.isAnonymous||!FS()){if(err)err.textContent='Please log in with your delivery account.';return;}try{const snap=await FS().collection('orders').where('deliveryEmail','==',String(u.email||'').toLowerCase()).get();deliveryAssignedList=snap.docs.map(d=>({id:d.id,...d.data()})).filter(o=>o.fulfillmentMode!=='pickup').sort((a,b)=>(b.created||0)-(a.created||0));render();}catch(e){if(err)err.textContent='Could not load assigned deliveries. Please contact the owner to verify your account assignment.';}}
async function deliverySetStatus(id,nextStatus){const allowed=['Confirmed','Delivered'];const u=AUTH()&&AUTH().currentUser,o=deliveryAssignedList.find(x=>x.id===id);if(!allowed.includes(nextStatus))return toast('Invalid delivery status.');if(!u||!FS()||!o||String(o.deliveryEmail||'').toLowerCase()!==String(u.email||'').toLowerCase())return toast('This order is not assigned to your account.');if(o.status==='Delivered')return toast('This order is already delivered.');try{const patch={status:nextStatus,deliveryStatusUpdatedAt:Date.now(),deliveryStatusUpdatedBy:u.uid};if(nextStatus==='Delivered'){patch.deliveryCompletedAt=Date.now();patch.deliveryCompletedBy=u.uid;}await FS().collection('orders').doc(id).update(patch);o.status=nextStatus;Object.assign(o,patch);render();toast('Order status updated: '+nextStatus);}catch(e){console.error(e);toast('Could not update status. Update Firestore Rules to allow this assigned delivery account to change status.');}}
async function deliveryLogout(){deliveryOrderResult=null;deliveryAssignedList=[];try{if(AUTH())await AUTH().signOut()}catch(e){}render();}


function reorder(id){
  const o=S.orders.find(x=>x.id===id);let n=0;
  o.items.forEach(i=>{const f=food(i.id);if(f&&f.avail){S.cart[f.id]=(S.cart[f.id]||0)+i.qty;n++}});
  save('cart');n?(toast(`${n} item(s) added to cart`),go('cart')):toast('Those items are not available now');
}

async function saveCustomerDistrict(){
  const district=(document.getElementById('profileDistrict')?.value||'').trim();
  const msg=document.getElementById('profileDistrictMsg');
  if(!NEPAL_DISTRICTS.includes(district)){if(msg)msg.textContent='Please choose a district from the list.';return toast('Select your district first.');}
  S.customer={...(S.customer||{}),district};DB.set('customer',S.customer);
  const u=AUTH()&&AUTH().currentUser;
  if(u&&!u.isAnonymous&&FS()){
    try{await FS().collection('users').doc(u.uid).set({email:u.email||'',district,locationDistrict:district,updatedAt:Date.now()},{merge:true});}
    catch(e){console.warn('Could not sync district to user profile:',e);}
  }
  if(msg)msg.textContent='✅ Your district is saved: '+district;
  toast('District saved: '+district);
  go('home');

async function customerLogin(create){
  const email=($('#custEmail')?.value||'').trim().toLowerCase(),password=$('#custPassword')?.value||'',err=$('#custAuthErr');
  if(err)err.textContent='';
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){if(err)err.textContent='Enter a valid email address.';return;}
  if(password.length<6){if(err)err.textContent='Password must be at least 6 characters.';return;}
  if(!FIREBASE_ONLINE||!AUTH()){if(err)err.textContent='Online service is temporarily unavailable. Check internet and Firebase configuration.';return;}
  try{
    const result=create?await AUTH().createUserWithEmailAndPassword(email,password):await AUTH().signInWithEmailAndPassword(email,password);
    S.customer={...(S.customer||{}),email:result.user.email};DB.set('customer',S.customer);watchCustomerOrders();toast(create?'Customer account created':'Welcome back');go(S.customer.district&&NEPAL_DISTRICTS.includes(S.customer.district)?'home':'account');
  }catch(e){console.error('Customer email authentication failed',e);const msgs={'auth/email-already-in-use':'This email already has an account. Please log in.','auth/invalid-credential':'Email or password is incorrect.','auth/user-not-found':'No account found. Create an account first.','auth/weak-password':'Choose a stronger password (at least 6 characters).','auth/operation-not-allowed':'Please contact the website administrator to enable email sign-in.'};if(err)err.textContent=msgs[e.code]||('Could not sign in: '+(e.code||e.message));}
}
async function customerSendOtp(){
  const phone=($('#custPhone')?.value||'').trim().replace(/[\s()-]/g,'');const err=$('#phoneAuthErr');if(err)err.textContent='';
  if(!/^\+[1-9]\d{7,14}$/.test(phone)){if(err)err.textContent='Enter phone in international format, e.g. +97798XXXXXXXX.';return;}
  if(!FIREBASE_ONLINE||!AUTH()){if(err)err.textContent='Online service is temporarily unavailable.';return;}
  try{
    if(!phoneRecaptchaVerifier){phoneRecaptchaVerifier=new firebase.auth.RecaptchaVerifier('phone-recaptcha-container',{size:'normal'});await phoneRecaptchaVerifier.render();}
    phoneConfirmationResult=await AUTH().signInWithPhoneNumber(phone,phoneRecaptchaVerifier);
    if(err)err.textContent='OTP sent. Check your SMS messages.';toast('Verification code sent');
  }catch(e){console.error('Phone OTP send failed',e);if(phoneRecaptchaVerifier){try{phoneRecaptchaVerifier.clear()}catch(_){}phoneRecaptchaVerifier=null;}const msgs={'auth/operation-not-allowed':'Please contact the website administrator to enable phone sign-in.','auth/invalid-phone-number':'Enter a valid phone number with country code.','auth/too-many-requests':'Too many attempts. Try again later.','auth/unauthorized-domain':'This website domain is not authorized for sign-in. Please contact support.'};if(err)err.textContent=msgs[e.code]||('Could not send OTP: '+(e.code||e.message));}
}
async function customerVerifyOtp(){
  const otp=($('#custOtp')?.value||'').trim(),err=$('#phoneAuthErr');if(err)err.textContent='';
  if(!phoneConfirmationResult){if(err)err.textContent='Tap Send OTP first.';return;}if(!/^\d{6}$/.test(otp)){if(err)err.textContent='Enter the 6-digit OTP.';return;}
  try{const result=await phoneConfirmationResult.confirm(otp);S.customer={...(S.customer||{}),phone:result.user.phoneNumber||''};DB.set('customer',S.customer);phoneConfirmationResult=null;watchCustomerOrders();toast('Phone verified successfully');go('home');}
  catch(e){console.error('Phone OTP verify failed',e);if(err)err.textContent=e.code==='auth/invalid-verification-code'?'Incorrect OTP. Please try again.':('Verification failed: '+(e.code||e.message));}
}
async function customerForgotPassword(){
  const email=($('#custEmail')?.value||'').trim().toLowerCase(),err=$('#custAuthErr');if(err)err.textContent='';
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){if(err)err.textContent='Enter your email address above first.';return;}

async function deleteRestaurant(id){
  if(!isSuperAdmin())return toast('Super Admin login required.');
  if(id===DEFAULT_RESTAURANT_ID)return toast('The default Esquare Lounge restaurant cannot be deleted.');
  const r=RESTAURANTS.find(x=>x.id===id);if(!r)return toast('Restaurant not found.');
  if(!confirm(`Permanently delete "${r.name||'this restaurant'}" from the restaurant directory? This does not automatically delete its orders or food records.`))return;

function pickImg(inp){
  if(!isOwner()){if(inp)inp.value='';return toast('Only the authenticated restaurant owner can upload food photos.');}
  const file=inp&&inp.files&&inp.files[0];if(!file)return;
  if(!/^image\\//i.test(file.type)){toast('Please choose an image file');inp.value='';return;}
  if(file.size>20*1024*1024){toast('Choose a photo smaller than 20 MB');inp.value='';return;}
  const rd=new FileReader();
  rd.onerror=()=>{const er=$('#fer');if(er)er.textContent='Could not read the photo. Try another image.';toast('Could not read the photo. Try another image.');inp.value='';};
  rd.onload=()=>{
    const im=new Image();
    im.onerror=()=>{const er=$('#fer');if(er)er.textContent='Could not open that image. Try JPG or PNG.';toast('Could not open that image. Try JPG or PNG.');inp.value='';};
    im.onload=()=>{
      try{
        const M=640,k=Math.min(1,M/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
        const ctx=c.getContext('2d');if(!ctx)throw new Error('Image editor is unavailable');
        ctx.drawImage(im,0,0,c.width,c.height);
        S.tmpImg=c.toDataURL('image/jpeg',.72);
        const link=$('#fi');if(link)link.value='';
        updPv();const er=$('#fer');if(er)er.textContent='Photo selected successfully. Now tap Save food.';toast('Photo selected. Now tap Save food.');
      }catch(e){console.error('Photo processing failed',e);toast('Photo processing failed. Try a smaller JPG image.');}
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(file);
}
async function saveFood(id){
  if(!isOwner())return toast('Please log in with the registered restaurant owner account before adding or editing food.');
  const er=$('#fer'),btn=$('#saveFoodBtn');
  const d={name:$('#fn').value.trim(),cat:$('#fc').value,price:Math.round(+$('#fp').value),emoji:$('#fe').value.trim()||'🍽️',desc:$('#fd').value.trim(),img:S.tmpImg||'',avail:$('#fa').checked,foodType:$('#ft')?.value||'veg'};
  if(d.name.length<2){if(er)er.textContent='Enter a food name.';return;}
  if(!(d.price>=0)||$('#fp').value===''){if(er)er.textContent='Enter a valid price.';return;}
  if(d.img&&!/^(https?:\/\/|data:image\/)/i.test(d.img)){if(er)er.textContent='Image link must start with http:// or https://';return;}
  if(btn){btn.disabled=true;btn.textContent='Saving menu item…';}
  const previousFoods=JSON.stringify(S.foods);
  try{
    if(!d.desc)d.desc='Freshly prepared and delicious.';
    const itemId=id||('f'+uid());
    // Store selected gallery image in IndexedDB, not localStorage or Firebase Storage.
    if(String(d.img).startsWith('data:image/'))await putLocalFoodPhoto(itemId,d.img);
    else await deleteLocalFoodPhoto(itemId);
    if(id){const target=food(id);if(!target)throw new Error('Menu item no longer exists.');Object.assign(target,d,{id:itemId,img:d.img});}
    else S.foods.unshift({id:itemId,...d});
    // Keep image bytes in memory for immediate preview; persist only small menu metadata locally.
    if(!persistFoodsWithoutPhotos())throw new Error('Device storage is full. Free some space and try again.');
    let cloudSynced=false;
    if(FIREBASE_ONLINE&&FS()&&AUTH()&&AUTH().currentUser&&AUTH().currentUser.uid===OWNER_UID){
      const suffix=RESTAURANT_ID===DEFAULT_RESTAURANT_ID?'':'__'+RESTAURANT_ID;
      const cloudFoods=S.foods.map(item=>({...item,img:String(item.img||'').startsWith('data:image/')?'':(item.img||'')}));
      try{await FS().collection('appState').doc('foods'+suffix).set({value:cloudFoods,updatedAt:Date.now(),updatedBy:AUTH().currentUser.uid,restaurantId:RESTAURANT_ID});cloudSynced=true;}
      catch(cloudErr){console.warn('Menu metadata cloud sync failed; local menu/photo retained:',cloudErr);}
    }
    closeSheet();
    toast(id?(cloudSynced?'Food updated. Photo saved on this device.':'Food updated locally; photo saved on this device.'):(cloudSynced?'Food added. Photo saved on this device.':'Food added locally; photo saved on this device.'));
    render();
  }catch(err){
    try{S.foods=JSON.parse(previousFoods);DB.set('foods',S.foods);}catch(restoreErr){console.warn('Could not restore local food list',restoreErr);}
    console.error('Food save failed',err);
    if(er)er.textContent='Could not save this item: '+(err.message||'Please try again.');
    if(btn){btn.disabled=false;btn.textContent='Retry save';}
  }
}

function openSubmittedCustomerMap(event, rawUrl){
  if(event) event.preventDefault();
  let u;
  try { u = new URL(rawUrl); } catch (_) { toast('Customer location link is invalid.'); return false; }
  if(!['https:','http:'].includes(u.protocol)){ toast('Invalid location link. Only HTTP/HTTPS URLs are supported.'); return false; }
  // Open the customer's exact submitted Google Maps URL; Android WebView may handle this via its external browser/app.
  try { window.open(u.href, '_blank'); } catch (_) {}
  // Fallback for WebViews that block popup windows: navigate directly to the submitted Maps link.
  setTimeout(function(){
    try { if(document.visibilityState === 'visible') window.location.href = u.href; } catch (_) {}
  }, 250);
  return false;
}

function downloadTextFile(name,content,type='text/plain'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function exportMenuCSV(){if(!isOwner())return toast('Staff login required.');const rows=[['Name','Category','Price NPR','Available','Description'],...S.foods.map(f=>[f.name,f.cat,f.price,f.avail?'Yes':'No',f.desc||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadTextFile('nepali-food-menu.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('Menu CSV exported');}
function exportOrdersCSV(){if(!isOwner())return toast('Staff login required.');const rows=[['Order ID','Date','Restaurant','Customer','Phone','District','Status','Fulfilment','Subtotal','Extra fee','Total','Payment','Items'],...S.orders.map(o=>[o.id,new Date(o.created||Date.now()).toISOString(),o.restaurantName||'',o.customer?.name||'',o.customer?.phone||'',o.customer?.district||'',o.status||'',o.fulfillmentMode||'',o.sub??'',o.fee??'',o.total??'',o.payment||'',(o.items||[]).map(i=>`${i.qty} x ${i.name}`).join('; ')])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadTextFile('nepali-food-orders.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('Orders CSV exported');}
function exportLocalBackup(){if(!isOwner())return toast('Staff login required.');const keys=['cats','foods','orders','customers','customer','wish','cart','my','recentSearches','recentlyViewed'];const data={app:'Esquare Lounge',backupVersion:1,createdAt:new Date().toISOString(),data:Object.fromEntries(keys.map(k=>[k,DB.get(k,null)]))};downloadTextFile('nepali-online-food-backup.json',JSON.stringify(data,null,2),'application/json');toast('Backup downloaded');}
function importLocalBackup(input){if(!isOwner())return toast('Staff login required.');const file=input.files&&input.files[0];if(!file)return;if(file.size>5*1024*1024)return toast('Backup file must be smaller than 5 MB.');const reader=new FileReader();reader.onload=()=>{try{const b=JSON.parse(reader.result);if(b.app!=='Esquare Lounge'||!b.data||!Array.isArray(b.data.foods)||!Array.isArray(b.data.cats))throw new Error('This is not a valid Esquare Lounge backup.');if(!confirm('Restore this backup on this device? Current local catalog and saved data will be replaced.'))return;Object.entries(b.data).forEach(([k,v])=>DB.set(k,v));load();render();toast('Backup restored on this device');}catch(e){toast('Could not restore backup: '+e.message)}};reader.readAsText(file);}

function exportPendingOrdersCSV(){if(!isOwner())return toast('Staff login required.');const rows=[['Order ID','Date','Customer','Phone','District','Status','Total','Items'],...S.orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).map(o=>[o.id,new Date(o.created||Date.now()).toISOString(),o.customer?.name||'',o.customer?.phone||'',o.customer?.district||'',o.status||'',o.total??'',(o.items||[]).map(i=>`${i.qty} x ${i.name}`).join('; ')])];if(rows.length===1)return toast('No active orders to export');const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadTextFile('nepali-food-active-orders.csv','\ufeff'+csv,'text/csv;charset=utf-8');toast('Active orders exported');}

function printAdminReport(){if(!isOwner())return toast('Staff login required.');const total=S.orders.reduce((n,o)=>n+Number(o.total||0),0),delivered=S.orders.filter(o=>o.status==='Delivered').length,active=S.orders.filter(o=>!['Delivered','Cancelled'].includes(o.status)).length;const win=window.open('','_blank');if(!win)return toast('Allow pop-ups to print the report');win.document.write('<html><head><title>Esquare Lounge Report</title><style>body{font:14px Arial;padding:24px}h1{color:#C8102E}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px;text-align:left}</style></head><body><h1>Esquare Lounge — Admin Report</h1><p>Report date: '+new Date().toLocaleString()+'</p><table><tr><th>Metric</th><th>Value</th></tr><tr><td>Total orders loaded</td><td>'+S.orders.length+'</td></tr><tr><td>Active orders</td><td>'+active+'</td></tr><tr><td>Delivered orders</td><td>'+delivered+'</td></tr><tr><td>Order value total (all loaded orders)</td><td>Rs. '+total.toFixed(2)+'</td></tr><tr><td>Menu items</td><td>'+S.foods.length+'</td></tr><tr><td>Available items</td><td>'+S.foods.filter(f=>f.avail).length+'</td></tr><tr><td>Sold out items</td><td>'+S.foods.filter(f=>!f.avail).length+'</td></tr></table><p>Note: totals reflect the orders currently available in this report.</p></body></html>');win.document.close();win.focus();win.print();}

function showTopSellingFoods(){const m={};S.orders.forEach(o=>(o.items||[]).forEach(i=>{const k=String(i.name||'Unknown');m[k]=(m[k]||0)+Number(i.qty||1)}));const out=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10).map((x,i)=>(i+1)+'. '+x[0]+' — '+x[1]+' sold');alert('TOP FOOD ITEMS (from loaded orders)\n\n'+(out.join('\n')||'No item-level order data available'));}

function staffQuickAction(key){
  if(!isOwner()) return toast('Authorized staff login required.');
  const orders=Array.isArray(S.orders)?S.orders:[], foods=Array.isArray(S.foods)?S.foods:[];
  const now=new Date(), today=now.toDateString(), dayAgo=new Date(now.getTime()-86400000).toDateString();
  const active=o=>!['Delivered','Served','Cancelled','Rejected'].includes(String(o.status||''));
  const stamp=o=>new Date(o.created||0), customer=o=>o.customer||{};
  const idline=o=>`${o.id} | ${o.status||'Pending'} | ${customer(o).name||'Customer'} | ${customer(o).phone||'No phone'} | Rs. ${Number(o.total||0).toFixed(2)}`;
  const itemLines=o=>(o.items||[]).map(i=>`${Number(i.qty||i.quantity||1)} × ${i.name||'Item'}`).join(', ');
  const byStatus=st=>orders.filter(o=>String(o.status||'Pending').toLowerCase()===st);
  const copy=(title,lines)=>nofCopyText(title+'\n'+(lines.length?lines.join('\n'):'No matching records.'),title+' copied.');
  const csv=(name,rows)=>{const body=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadTextFile(name,'\ufeff'+body,'text/csv;charset=utf-8');toast('CSV exported.');};
  const print=(title,lines)=>{const w=window.open('','_blank','width=760,height=800');if(!w)return toast('Allow pop-ups to print.');w.document.write('<!doctype html><html><head><title>'+esc(title)+'</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px Arial;padding:24px;color:#111}h1{font-size:22px}hr{border:0;border-top:1px solid #bbb}pre{white-space:pre-wrap;font:14px Arial;line-height:1.55}</style></head><body><h1>'+esc(title)+'</h1><p>'+esc(new Date().toLocaleString())+'</p><hr><pre>'+esc(lines.join('\n\n'))+'</pre><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close();};
  let list=[], title='Staff quick report';
  switch(key){
    case 'pending_ids':list=byStatus('pending');title='Pending order IDs';break;
    case 'confirmed_ids':list=byStatus('confirmed');title='Confirmed order IDs';break;
    case 'preparing_ids':list=byStatus('preparing');title='Preparing order IDs';break;
    case 'delivered_ids':list=byStatus('delivered');title='Delivered order IDs';break;
    case 'cancelled_ids':list=byStatus('cancelled');title='Cancelled order IDs';break;
    case 'active_ids':list=orders.filter(active);title='Active order IDs';break;
    case 'today_ids':list=orders.filter(o=>stamp(o).toDateString()===today);title='Today order IDs';break;
    case 'yesterday_ids':list=orders.filter(o=>stamp(o).toDateString()===dayAgo);title='Yesterday order IDs';break;
    case 'pending_summary':list=byStatus('pending');title='Pending order briefing';copy(title,list.map(idline));return;
    case 'kitchen_queue':list=orders.filter(o=>['Pending','Confirmed','Preparing'].includes(o.status));title='Kitchen preparation queue';copy(title,list.map(o=>idline(o)+'\n'+itemLines(o)));return;
    case 'delivery_queue':list=orders.filter(o=>active(o)&&o.fulfillmentMode!=='pickup');title='Delivery queue';copy(title,list.map(o=>idline(o)+'\n'+(customer(o).address||'Address missing')));return;
    case 'pickup_queue':list=orders.filter(o=>active(o)&&o.fulfillmentMode==='pickup');title='Pickup queue';break;
    case 'cash_orders':list=orders.filter(o=>/cash|cod/i.test(o.payment||''));title='Cash / COD orders';break;
    case 'online_orders':list=orders.filter(o=>/esewa|khalti|online|qr|digital/i.test(o.payment||''));title='Digital payment orders';break;
    case 'district_summary':{const m={};orders.forEach(o=>{const d=customer(o).district||'Not provided';m[d]=(m[d]||0)+1});copy('Orders by district',Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+': '+v));return;}
    case 'hour_summary':{const m={};orders.forEach(o=>{const h=stamp(o).getHours();m[h]=(m[h]||0)+1});copy('Orders by hour',Object.entries(m).sort((a,b)=>Number(a[0])-Number(b[0])).map(([h,v])=>`${String(h).padStart(2,'0')}:00 — ${v} orders`));return;}
    case 'top_customers':case 'repeat_customers':{const m={};orders.forEach(o=>{const c=customer(o),k=String(c.phone||c.name||'Unknown');m[k]??={name:c.name||'Customer',phone:c.phone||'',n:0,total:0};m[k].n++;m[k].total+=Number(o.total||0)});let a=Object.values(m).sort((x,y)=>y.n-x.n);if(key==='repeat_customers')a=a.filter(x=>x.n>1);copy(key==='top_customers'?'Top customers':'Repeat customers',a.map(x=>`${x.name} | ${x.phone} | ${x.n} orders | Rs. ${x.total.toFixed(2)}`));return;}
    case 'phonebook':case 'today_customers':{let a=orders.filter(o=>key!=='today_customers'||stamp(o).toDateString()===today);const m=new Map();a.forEach(o=>{const c=customer(o);if(c.phone)m.set(c.phone,`${c.name||'Customer'} — ${c.phone}`)});copy(key==='phonebook'?'Customer phonebook':'Today customers',[...m.values()]);return;}
    case 'missing_phone':list=orders.filter(o=>!customer(o).phone);title='Orders missing phone';break;
    case 'missing_address':list=orders.filter(o=>o.fulfillmentMode!=='pickup'&&!customer(o).address);title='Orders missing delivery address';break;
    case 'missing_location':list=orders.filter(o=>o.fulfillmentMode!=='pickup'&&!(customer(o).location&&customer(o).location.lat!=null&&customer(o).location.lng!=null)&&!customer(o).mapsUrl);title='Orders without map location';break;
    case 'high_value':list=orders.filter(o=>Number(o.total||0)>=2000).sort((a,b)=>Number(b.total||0)-Number(a.total||0));title='High-value orders (Rs. 2,000+)';break;
    case 'low_value':list=orders.filter(o=>Number(o.total||0)>0&&Number(o.total||0)<500).sort((a,b)=>Number(a.total||0)-Number(b.total||0));title='Low-value orders (under Rs. 500)';break;
    case 'average_value':{const total=orders.reduce((n,o)=>n+Number(o.total||0),0);alert('Average order value\n\nOrders: '+orders.length+'\nTotal order value: Rs. '+total.toFixed(2)+'\nAverage: Rs. '+(orders.length?total/orders.length:0).toFixed(2));return;}
    case 'today_revenue':case 'week_revenue':case 'month_revenue':{const a=orders.filter(o=>{const d=stamp(o);return key==='today_revenue'?d.toDateString()===today:key==='week_revenue'?now-d<=7*86400000:d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});const sum=a.reduce((n,o)=>n+Number(o.total||0),0);alert(title+'\nOrders: '+a.length+'\nOrder value: Rs. '+sum.toFixed(2));return;}
    case 'menu_available':copy('Available menu',foods.filter(f=>f.avail).map(f=>`${f.name} — Rs. ${f.price}`));return;
    case 'menu_soldout':copy('Sold-out menu',foods.filter(f=>!f.avail).map(f=>`${f.name} — Rs. ${f.price}`));return;
    case 'menu_no_photo':list=foods.filter(f=>!f.img&&!f.image&&!f.photo);title='Menu items without photo';break;
    case 'menu_no_desc':list=foods.filter(f=>!String(f.desc||'').trim());title='Menu items without description';break;
    case 'menu_bad_price':list=foods.filter(f=>!(Number(f.price)>0));title='Menu items with invalid price';break;
    case 'menu_duplicates':{const m={};foods.forEach(f=>{const k=String(f.name||'').trim().toLowerCase();(m[k]??=[]).push(f.name)});copy('Duplicate menu names',Object.values(m).filter(a=>a.length>1).map(a=>a[0]+' ('+a.length+')'));return;}
    case 'menu_price_sort':copy('Menu sorted by price',[...foods].sort((a,b)=>Number(a.price||0)-Number(b.price||0)).map(f=>`${f.name} — Rs. ${Number(f.price||0).toFixed(2)}`));return;
    case 'menu_categories':{const m={};foods.forEach(f=>(m[f.cat||'Other']??=[]).push(`${f.name} — Rs. ${f.price}`));copy('Menu by category',Object.entries(m).flatMap(([k,v])=>[k,...v,'']));return;}
    case 'item_sales':{const m={};orders.forEach(o=>(o.items||[]).forEach(i=>{const k=i.name||'Unknown';m[k]=(m[k]||0)+Number(i.qty||i.quantity||1)}));copy('Top-selling items',Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([n,q],i)=>`${i+1}. ${n} — ${q} sold`));return;}
    case 'print_kitchen':list=orders.filter(o=>['Pending','Confirmed','Preparing'].includes(o.status));title='Kitchen queue';break;
    case 'print_delivery':list=orders.filter(o=>active(o)&&o.fulfillmentMode!=='pickup');title='Delivery queue';break;
    case 'print_today':list=orders.filter(o=>stamp(o).toDateString()===today);title='Today order sheet';break;
    case 'print_customers':{const m=new Map();orders.forEach(o=>{const c=customer(o);if(c.phone)m.set(c.phone,`${c.name||'Customer'} | ${c.phone} | ${c.address||'No address'}`)});print('Customer contact sheet',[...m.values()]);return;}
    case 'export_active':list=orders.filter(active);title='Active orders';break;
    case 'export_today':list=orders.filter(o=>stamp(o).toDateString()===today);title='Today orders';break;
    case 'export_menu_health':csv('menu-health.csv',[['Name','Category','Price','Available','Has photo','Has description'],...foods.map(f=>[f.name,f.cat,f.price,!!f.avail,!!(f.img||f.image||f.photo),!!String(f.desc||'').trim()])]);return;
    case 'whatsapp_brief':{const a=orders.filter(active);copy('Staff order update',[`Active orders: ${a.length}`,`Pending: ${byStatus('pending').length}`,`Preparing: ${byStatus('preparing').length}`,`Delivery: ${a.filter(o=>o.fulfillmentMode!=='pickup').length}`,`Pickup: ${a.filter(o=>o.fulfillmentMode==='pickup').length}`]);return;}
    case 'opening_checklist':copy('Opening checklist',['Check Firebase connection and staff login','Turn on order sound/voice alerts','Check printer and paper','Review pending orders','Check menu availability and prices','Confirm delivery staff availability','Check customer support phone']);return;
    case 'closing_checklist':copy('Closing checklist',['Review all pending and preparing orders','Confirm delivered/picked-up orders are updated','Review cash and digital payment records','Mark unavailable menu items sold out','Export today’s orders and revenue report','Download a local backup and store it securely','Sign out of shared devices']);return;
    case 'shift_handover':{const a=orders.filter(active);copy('Shift handover',[`Handover time: ${new Date().toLocaleString()}`,`Active orders: ${a.length}`,...a.map(idline),`Delivery assignments: ${a.filter(o=>o.deliveryEmail).length}`]);return;}
    case 'stockout_alert':copy('Sold-out item alert',foods.filter(f=>!f.avail).map(f=>`${f.name} — currently unavailable`));return;
    default:toast('This quick action is not available.');return;
  }
  if(key.startsWith('print_')){print(title,list.map(o=>idline(o)+'\n'+itemLines(o)+'\n'+(customer(o).address||'')));return;}
  if(key.startsWith('export_')){csv(title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv',[['Order ID','Date','Status','Customer','Phone','Address','Items','Payment','Total'],...list.map(o=>[o.id,stamp(o).toLocaleString(),o.status,customer(o).name,customer(o).phone,customer(o).address,itemLines(o),o.payment,o.total])]);return;}
  copy(title,list.map(idline));
}

const CLOSING_TASKS=[
  'Confirm all dine-in, takeaway and delivery orders are completed or clearly handed over.',
  'Reconcile cash, digital payments, refunds and the day\'s sales.',
  'Review pending/unpaid orders and record any issues.',
  'Clean and sanitize tables, kitchen, counters and equipment.',
  'Store food safely, label/date items and check perishables.',
  'Switch off and secure cooking equipment, gas, lights and nonessential appliances.',
  'Check stock shortages and note items to restock.',
  'Secure cash, devices, doors and premises.',
  'Save/export today\'s order and sales report, if available.',
  'Record staff handover notes and incidents for tomorrow.'
];
function closingDayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function closingStorageKey(){return 'esquare_closing_checklist_v1_'+String(RESTAURANT_ID||'default')+'_'+closingDayKey();}
function getClosingChecklist(){try{const v=JSON.parse(localStorage.getItem(closingStorageKey())||'{}');return {done:Array.isArray(v.done)?v.done.filter(n=>Number.isInteger(n)&&n>=0&&n<CLOSING_TASKS.length):[],notes:String(v.notes||''),updatedAt:v.updatedAt||''};}catch(e){return {done:[],notes:'',updatedAt:''};}}
function putClosingChecklist(v){try{v.updatedAt=new Date().toISOString();localStorage.setItem(closingStorageKey(),JSON.stringify(v));return true;}catch(e){toast('Could not save checklist on this device.');return false;}}
function setClosingItem(index,checked){const v=getClosingChecklist(),set=new Set(v.done);if(checked)set.add(Number(index));else set.delete(Number(index));v.done=[...set].sort((a,b)=>a-b);putClosingChecklist(v);render();}
function setAllClosingItems(checked){const v=getClosingChecklist();v.done=checked?CLOSING_TASKS.map((_,i)=>i):[];putClosingChecklist(v);render();toast(checked?'All closing tasks marked complete.':'Checklist cleared.');}
function saveClosingNotes(value){const v=getClosingChecklist();v.notes=String(value||'').slice(0,2000);putClosingChecklist(v);}
function copyClosingChecklist(){const v=getClosingChecklist(),lines=CLOSING_TASKS.map((t,i)=>(v.done.includes(i)?'[x] ':'[ ] ')+t);if(v.notes.trim())lines.push('Follow-up notes: '+v.notes.trim());nofCopyText('ESQUARE LOUNGE — DAILY CLOSING CHECKLIST ('+closingDayKey()+')\n'+lines.join('\n'),'Closing checklist copied.');}
function printClosingChecklist(){const v=getClosingChecklist(),w=window.open('','_blank','width=760,height=850');if(!w)return toast('Allow pop-ups to print the closing checklist.');const rows=CLOSING_TASKS.map((t,i)=>`<li style="margin:12px 0;list-style:none"><span style="display:inline-block;width:22px">${v.done.includes(i)?'☑':'☐'}</span>${esc(t)}</li>`).join('');w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Esquare Lounge Closing Checklist</title><style>body{font:15px Arial,sans-serif;padding:24px;max-width:720px;margin:auto}h1{text-align:center}hr{border:0;border-top:1px solid #aaa} .notes{white-space:pre-wrap;border:1px solid #aaa;padding:12px;min-height:65px}</style></head><body><h1>ESQUARE LOUNGE</h1><h2>Daily Closing Checklist</h2><p>Date: '+esc(closingDayKey())+'</p><hr><ul style="padding:0">'+rows+'</ul><h3>Follow-up notes</h3><div class="notes">'+esc(v.notes||'None')+'</div><p>Completed: '+v.done.length+' / '+CLOSING_TASKS.length+'</p><script>window.onload=()=>window.print();<\/script></body></html>');w.document.close();}
function closingChecklistCard(){const v=getClosingChecklist(),count=v.done.length,pct=Math.round(count/CLOSING_TASKS.length*100);return `<div class="card" style="border:2px solid #1f9d57"><div class="row sp" style="align-items:center"><div><h3 style="margin:0">🌙 Daily closing checklist</h3><div class="mut">${closingDayKey()} · Saved on this device</div></div><b style="color:var(--ok)">${count}/10</b></div><div style="height:9px;background:#e8edf0;border-radius:20px;overflow:hidden;margin:12px 0"><div style="height:100%;width:${pct}%;background:#1f9d57;border-radius:20px"></div></div><div class="mut" style="margin-bottom:8px">${pct}% complete · Tick each task as staff finish it. A fresh checklist starts automatically each day.</div>${CLOSING_TASKS.map((t,i)=>`<label class="row" style="align-items:flex-start;gap:10px;padding:10px 2px;border-top:1px solid var(--ln)"><input type="checkbox" style="margin-top:4px;flex:0 0 auto" ${v.done.includes(i)?'checked':''} onchange="setClosingItem(${i},this.checked)"><span style="line-height:1.5;${v.done.includes(i)?'text-decoration:line-through;color:var(--mut)':''}">${i+1}. ${esc(t)}</span></label>`).join('')}<label class="f" for="closingNotes">📝 Follow-up notes / issues for tomorrow</label><textarea id="closingNotes" class="fi" rows="3" maxlength="2000" placeholder="Write shortages, unpaid bills, equipment issues or staff handover notes…" onchange="saveClosingNotes(this.value)">${esc(v.notes)}</textarea><div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="btn sm" onclick="setAllClosingItems(true)">✅ Mark all complete</button><button class="btn gray sm" onclick="copyClosingChecklist()">📋 Copy checklist</button><button class="btn alt sm" onclick="printClosingChecklist()">🖨️ Print</button><button class="btn danger sm" onclick="setAllClosingItems(false)">↺ Reset</button></div><p class="mut" style="margin:10px 0 0">Checklist progress and notes are saved in this browser for the selected restaurant and date. They do not sync to other devices or Firebase.</p></div>`;}

async function deletePreviousOrders(){
  if(!isOwner())return toast('Owner login required.');
  if(!confirm('Delete ALL previous orders for Esquare Lounge? This cannot be undone.'))return;
  if(!confirm('Final confirmation: permanently delete these orders from Firebase?'))return;
  try{
    if(!FIREBASE_ONLINE||!FS())throw new Error('Firebase is unavailable.');
    const q=isSuperAdmin()
      ? FS().collection('orders').where('restaurantId','==',S.ownerRestaurantId||RESTAURANT_ID)
      : FS().collection('orders').where('restaurantId','==',S.ownerRestaurantId||RESTAURANT_ID);
    const snap=await q.get();
    let deleted=0;
    for(let i=0;i<snap.docs.length;i+=450){
      const batch=FS().batch();
      snap.docs.slice(i,i+450).forEach(d=>batch.delete(d.ref));
      await batch.commit();deleted+=Math.min(450,snap.docs.length-i);
    }
    S.orders=[];DB.set('orders',[]);
    toast(`Deleted ${deleted} previous order(s).`);
    render();
  }catch(e){console.error('Delete previous orders failed',e);toast('Could not delete orders: '+(e.code||e.message||'unknown error'));}
}

async function setOrderPaymentStatus(id,status){

    const o=S.orders.find(x=>x.id===id);if(!o)throw new Error('Order not found.');
    await FS().collection('orders').doc(id).update({paymentStatus:status,paymentStatusUpdatedAt:Date.now(),paymentStatusUpdatedBy:AUTH().currentUser.uid});
    o.paymentStatus=status;o.paymentStatusUpdatedAt=Date.now();o.paymentStatusUpdatedBy=AUTH().currentUser.uid;
    DB.set('orders',S.orders);render();toast('Payment marked '+status+'.');
  }catch(e){console.error('Payment status update failed',e);toast('Could not update payment: '+(e.code||e.message||'unknown error'));}
}
async function setOrderEstimate(id,estimate){
  if(!isOwner())return toast('Please log in with an authorized staff account first');
  if(!['10–15 minutes','15–20 minutes'].includes(estimate))return;
  try{
    if(!FIREBASE_ONLINE||!FS())throw new Error('Online service is unavailable.');
    await FS().collection('orders').doc(id).update({prepEstimate:estimate,prepEstimateUpdatedAt:Date.now()});
    const o=S.orders.find(x=>x.id===id);if(o)o.prepEstimate=estimate;
    DB.set('orders',S.orders);render();toast('Customer wait-time updated.');
  }catch(e){console.error(e);toast('Could not update wait-time: '+(e.code||e.message));}
}
async function setStatus(id,s){
  if(!isOwner())return toast('Please log in with an authorized staff account first');
  try{await saveOrderStatus(id,s);toast(`${id} → ${s}`)}catch(e){console.error(e);toast(e.message||'Could not update order')}
}

function aSet(){
  return `<div class="card"><b>Restaurant ordering mode</b><p class="mut">Dine-in only. Customers order using their table number. Orders are sent to the kitchen queue in the Admin Panel. Payment is handled at the restaurant counter.</p></div>
  <div class="card"><b>Restaurant owner account</b><p class="mut">Admin access is managed securely through staff account service.</p><p class="mut"><b>Restaurant ID:</b> ${RESTAURANT_ID}</p></div>
  <div class="card"><b>Data & security</b><p class="mut">Customer orders are stored as individual Firestore documents. Only authorized admin accounts should read and update orders through Firestore Security Rules.</p></div>
  <button class="btn gray" onclick="logout()">Log out</button>`;
}

function resetAll(){
  if(!confirm('This deletes all foods, orders, customers and carts on this device. Continue?'))return;
  Object.keys(localStorage).filter(k=>k.startsWith('nof_')).forEach(k=>localStorage.removeItem(k));
  try{sessionStorage.clear()}catch(e){}load();toast('App reset');render();
}


/* ---------- Firebase auth persistence ---------- */
let authStateReady=false;
function startAuthStateListener(){
  if(!FIREBASE_ONLINE||!AUTH())return;
  AUTH().onAuthStateChanged(async user=>{
    authStateReady=true;
    if(user && user.uid===OWNER_UID){
      S.ownerUid=user.uid;S.ownerRestaurantId=null;S.adminIn=true;
      localStorage.setItem('nof_owner_login','1');watchAdminOrders();if(S.view==='admin')render();return;
    }
    if(user && !user.isAnonymous){
      try{const role=await FS().collection('restaurantOwners').doc(user.uid).get();if(role.exists&&role.data().active!==false&&role.data().restaurantId&&['owner','manager',undefined].includes(role.data().role)){S.staffRole=role.data().role==='manager'?'manager':'owner';S.ownerUid=user.uid;S.ownerRestaurantId=role.data().restaurantId;RESTAURANT_ID=S.ownerRestaurantId;localStorage.setItem('nof_selected_restaurant',RESTAURANT_ID);S.adminIn=true;await loadCloudCatalog();syncCatalog();watchAdminOrders();if(S.view==='admin')render();return;}}catch(e){console.warn('Owner role lookup failed',e)}
    }
    S.adminIn=false;S.staffRole=null;S.ownerRestaurantId=null;S.ownerUid=null;
    if(user){if(user.email)S.customer={...(S.customer||{}),email:user.email};DB.set('customer',S.customer);watchCustomerOrders();if(S.view==='account')S.view='home';}
    else if(S.view!=='admin'){S.view='home';}
    render();
  });
}

/* ---------- Start ---------- */
function init(){
  const R=$('#root');
  $('#layer').innerHTML=`<div class="splash" id="spl"><div class="lg">🍛</div><h1>Esquare Lounge</h1><small>Order directly from our restaurant</small><div class="ld"><i></i></div><small style="position:absolute;bottom:24px">Built by Niraj Xettri</small></div>`;
  setTimeout(async()=>{
    try{
      if(!window.localStorage)throw new Error('Storage unavailable');
      load();
      // Restore device-only photos from IndexedDB after the menu is ready.
      S.view='home';
      render();
      hydrateLocalFoodPhotos();
      if(FIREBASE_ONLINE&&AUTH()){
        startAuthStateListener();
        if(isOwner())watchAdminOrders();
      }
      syncCatalog();
      loadRestaurants();
      loadCloudCatalog();

      history.replaceState({root:1},'');history.pushState({v:'home'},'');
      try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
      const s=$('#spl');if(s){s.style.opacity=0;setTimeout(()=>{if($('#spl'))$('#layer').innerHTML=''},400)}
    }catch(e){
      console.error(e);$('#layer').innerHTML='';R.innerHTML=header('Something went wrong')+`<main>${empty('⚠️','Could not start the app',esc(e.message||'Unknown error'),`<br><button class="btn sm" onclick="init()">Retry</button>`)}</main>`;
    }
  },500);
}
// Live sync across tabs (simulates real-time backend): customer sees status changes made by admin
window.addEventListener('storage',e=>{
  if(!e.key||!e.key.startsWith('nof_')||!S.foods)return;
  S.foods=DB.get('foods',S.foods);S.cats=DB.get('cats',S.cats);S.orders=DB.get('orders',S.orders);
  if(!$('#layer').innerHTML&&!['checkout'].includes(S.view)&&document.activeElement.tagName!=='INPUT')render();
});
init();
</script>

<script>
/* Use a standard HTTPS Maps URL rather than an intent:// URL in Android WebView. */
document.addEventListener('click', function (event) {
  const a = event.target && event.target.closest ? event.target.closest('a[href]') : null;
  if (!a) return;
  let u;
  try { u = new URL(a.href, location.href); } catch (_) { return; }
  if (u.protocol === 'https:' &&
      (u.hostname === 'maps.google.com' || u.hostname === 'www.google.com' ||
       u.hostname === 'google.com' || u.hostname.endsWith('.google.com')) &&
      /maps|\?q=/.test(u.pathname + u.search)) {
    event.preventDefault();
    const q = u.searchParams.get('q') || u.searchParams.get('query') ||
              u.searchParams.get('destination') || u.pathname;
    location.href = 'https://maps.google.com/?q=' + encodeURIComponent(q);
  }
}, true);
</script>


<script>
function copyCustomerMapLink() {
  const el = document.getElementById('cmap');
  const value = (el && el.value || '').trim();
  if (!value) {
    alert('Please paste the Google Maps share link first.');
    return;
  }
  if (!/^https:\/\//i.test(value)) {
    alert('Please use a Google Maps link beginning with https://');
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(
      () => alert('Maps link copied. Open Chrome and paste it in the address bar.'),
      () => fallbackCopyMapsLink(el, value)
    );
  } else {
    fallbackCopyMapsLink(el, value);
  }
}
function fallbackCopyMapsLink(el, value) {
  el.focus();
  el.select();
  try {
    const ok = document.execCommand('copy');
    alert(ok ? 'Maps link copied. Open Chrome and paste it in the address bar.' : 'Select and copy the link, then paste it into Chrome.');
  } catch (_) {
    alert('Select and copy the link, then paste it into Chrome.');
  }
}
</script>
